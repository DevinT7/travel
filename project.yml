name: TravelHub
options:
  bundleIdPrefix: com.devint.travelhub
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TravelHub:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: TravelHub
    dependencies:
      - target: TravelHubWidgets
        destinationFilters: [iOS]
    info:
      path: TravelHub/Resources/Info.plist
      properties:
        # Location in the background only while a drive is being followed (live ETA).
        UIBackgroundModes: [fetch, location]
        NSLocationWhenInUseUsageDescription: "While you're driving to a stop, TravelHub uses your location to keep your arrival time up to date on the Lock Screen and in CarPlay."
        # SwiftUI owns the phone window; CarPlay gets its own template scene.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        BGTaskSchedulerPermittedIdentifiers: [com.devint.travelhub.flight-refresh]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devint.travelhub
        PRODUCT_NAME: TravelHub
        INFOPLIST_KEY_CFBundleDisplayName: TravelHub
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.travel
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSCalendarsWriteOnlyAccessUsageDescription: "TravelHub adds your flights, hotel stays and plans to your calendar. It can't see your other events."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: F4Q68YM222
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": TravelHub/Resources/TravelHub-macOS.entitlements
        # CarPlay (driving task). Simulator only until Apple grants the entitlement to the team at
        # developer.apple.com/carplay; then add the same line for [sdk=iphoneos*].
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": TravelHub/Resources/TravelHub-CarPlay.entitlements
        ENABLE_HARDENED_RUNTIME: YES
  TravelHubWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: TravelHubWidgets
      - path: TravelHub/Shared/FlightActivityAttributes.swift
      - path: TravelHub/Shared/DriveActivityAttributes.swift
    info:
      path: TravelHubWidgets/Info.plist
      properties:
        CFBundleDisplayName: TravelHub
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devint.travelhub.widgets
        PRODUCT_NAME: TravelHubWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: F4Q68YM222
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
